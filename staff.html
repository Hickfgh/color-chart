<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人員資料檢視 | 色票預約所</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
        :root{--paper:#f5f2ec;--ink:#24241f;--muted:#77766e;--line:#d8d4ca;--red:#c84b32;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif}
        *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}button,input{font:inherit}button,a{cursor:pointer}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#f8f6f1}.brand{display:flex;gap:10px;align-items:center;font-weight:700;text-decoration:none;color:inherit}.brand-mark{width:25px;height:25px;display:grid;place-items:center;background:var(--red);color:#fff;font:12px var(--mono)}main{max-width:1120px;margin:0 auto;padding:38px 5vw 70px}.eyebrow{font:11px var(--mono);color:var(--red)}h1{margin:8px 0;font-size:34px}p{color:var(--muted)}.login{max-width:380px;display:grid;gap:14px;margin-top:28px}.field{display:grid;gap:7px;font-size:12px}.field input{padding:11px;border:1px solid var(--line);background:#fbfaf7}.primary,.logout{border:0;padding:11px 16px;background:var(--ink);color:white}.error{min-height:18px;color:var(--red);font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 0 10px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--ink);padding:10px 8px}.table td{border-bottom:1px solid var(--line);padding:12px 8px}.mono{font:11px var(--mono)}.swatch{display:inline-block;width:24px;height:18px;border:1px solid #0001;vertical-align:middle}.hidden{display:none!important}@media(max-width:600px){main{padding:28px 18px 55px}h1{font-size:27px}.topbar{padding:0 18px}.table{min-width:680px}}
    </style>
</head>
<body>
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark">印</span><span>色票預約所 · 工作人員</span></a><a href="/" style="font-size:12px">回色票頁</a></header>
    <main><div class="eyebrow">STAFF VIEW · READ ONLY</div><h1>預約資料</h1><p>此帳號僅供查看，不可修改預約或管理設定。</p>
        <form id="login-form" class="login"><label class="field">工作人員帳號<input id="username" autocomplete="username" required></label><label class="field">密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登入查看</button><div id="error" class="error" role="status"></div></form>
        <section id="records" class="hidden"><div class="toolbar"><strong id="count"></strong><button id="logout" class="logout" type="button">登出</button></div><div class="table-wrap"><table class="table"><thead><tr><th>色票</th><th>色系</th><th>CMYK</th><th>暱稱</th><th>Email</th><th>登記時間</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="hidden">目前沒有預約紀錄。</p></section>
    </main>
    <script>
        const $=selector=>document.querySelector(selector);
        const tokenKey='color-chart-staff-token';
        let token=sessionStorage.getItem(tokenKey)||'';
        function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
        function cmykText(values){return `C${values[0]} M${values[1]} Y${values[2]} K${values[3]}`;}
        async function loadRecords(){const response=await fetch('/api/staff/reservations',{headers:{Authorization:`Bearer ${token}`}});if(!response.ok)throw new Error('登入已失效，請重新登入。');const records=await response.json();$('#login-form').classList.add('hidden');$('#records').classList.remove('hidden');$('#count').textContent=`共 ${records.length} 筆`;$('#empty').classList.toggle('hidden',records.length!==0);$('#rows').innerHTML=records.map(record=>`<tr><td><span class="swatch" style="background:${escapeHtml(record.hex)}"></span></td><td>${escapeHtml(record.categoryId)}</td><td class="mono">${escapeHtml(cmykText(record.cmyk))}</td><td>${escapeHtml(record.nickname||record.claimant)}</td><td>${escapeHtml(record.email||record.contact)}</td><td>${escapeHtml(new Date(record.createdAt).toLocaleString('zh-TW',{hour12:false}))}</td></tr>`).join('');}
        async function checkSession(){if(!token)return;try{await loadRecords();}catch(error){sessionStorage.removeItem(tokenKey);token='';$('#error').textContent=error.message;}}
        $('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#error').textContent='';try{const response=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});const result=await response.json();if(!response.ok)throw new Error('帳號或密碼不正確，請聯絡管理者。');token=result.token;sessionStorage.setItem(tokenKey,token);$('#password').value='';await loadRecords();}catch(error){$('#error').textContent=error.message;}});
        $('#logout').addEventListener('click',()=>{sessionStorage.removeItem(tokenKey);token='';$('#records').classList.add('hidden');$('#login-form').classList.remove('hidden');});
        checkSession();
    </script>
</body>
</html>
