<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ec">
    <title>色票預約所 | CMYK 色彩登記</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
        :root{--paper:#f5f2ec;--ink:#24241f;--muted:#77766e;--line:#d8d4ca;--red:#c84b32;--green:#47735a;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif}
        *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);font-size:14px}button,input{font:inherit}button{cursor:pointer}a{color:inherit}
        .topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#f8f6f1}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:0}.brand-mark{width:25px;height:25px;background:var(--red);display:grid;place-items:center;color:white;font:500 12px var(--mono)}.top-right{display:flex;align-items:center;gap:22px}.top-link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:4px}.live{font:11px var(--mono);color:var(--green);display:flex;gap:7px;align-items:center}.live:before{content:'';width:7px;height:7px;border-radius:50%;background:#5f9a70}
        main{max-width:1360px;margin:auto;padding:38px 5vw 80px}.masthead{display:flex;justify-content:space-between;align-items:end;gap:24px;border-bottom:1px solid var(--ink);padding:0 0 22px;margin-bottom:27px}.eyebrow{font:11px var(--mono);color:var(--red);letter-spacing:0;text-transform:uppercase}.masthead h1{font-size:clamp(27px,4vw,46px);letter-spacing:0;line-height:1.2;margin:8px 0 7px;font-weight:700}.masthead p{margin:0;color:var(--muted);font-size:13px}.count-block{text-align:right;white-space:nowrap}.count-number{font:30px var(--mono);line-height:1}.count-label{font-size:11px;color:var(--muted);margin-top:7px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 27px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;padding:7px 13px;font-size:12px;color:#57564f;transition:background .15s,color .15s,border-color .15s}.filter.active,.filter:hover{background:var(--ink);border-color:var(--ink);color:#fff}.search{width:205px;max-width:40vw;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;outline:none;font-size:12px}.search:focus{border-color:var(--ink)}
        .section{margin:0 0 34px;animation:appear .45s both}.section-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:0 0 10px;margin-bottom:14px}.section-head h2{font-size:17px;margin:0;font-weight:600}.section-head span{font:10px var(--mono);color:var(--muted)}.section-group{font-size:11px;color:var(--muted);margin-left:auto}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.swatch{border:1px solid var(--line);background:#fbfaf7;min-width:0;transition:border-color .18s,transform .18s;animation:appear .4s both}.swatch:not(.taken):hover{transform:translateY(-2px);border-color:#89867d}.swatch-color{height:76px;position:relative}.swatch.taken{opacity:.7}.swatch.taken .swatch-color:after{content:'已被選走';position:absolute;inset:0;display:grid;place-items:center;background:#24241f55;color:white;font-size:13px;font-weight:600;letter-spacing:0}.swatch-info{padding:10px 11px 11px}.swatch-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;font-weight:600}.status{font-size:10px;color:var(--green);font-weight:400;white-space:nowrap}.taken .status{color:var(--red)}.cmyk{font:10px var(--mono);color:#77766e;white-space:nowrap}.color-code{font:9px var(--mono);color:#aaa69c;margin-top:4px}.empty{padding:40px 0;color:var(--muted);text-align:center}
        .backdrop{position:fixed;inset:0;background:#1e1d1a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.backdrop.open{display:flex}.dialog{width:min(440px,100%);background:var(--paper);border:1px solid var(--ink);animation:appear .2s both}.dialog-color{height:80px}.dialog-body{padding:22px}.dialog-top{display:flex;justify-content:space-between;align-items:start}.dialog h2{font-size:20px;margin:0 0 5px}.dialog-cmyk{font:11px var(--mono);color:var(--muted)}.close{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1}.field{display:block;margin-top:17px;font-size:12px;font-weight:500}.field input{display:block;width:100%;margin-top:7px;border:1px solid var(--line);background:#fbfaf7;padding:11px;outline:none;font-size:13px}.field input:focus{border-color:var(--ink)}.hint{font-size:11px;color:var(--muted);margin:12px 0 18px}.submit{width:100%;border:0;background:var(--red);color:white;padding:12px;font-weight:600}.submit:disabled{opacity:.6;cursor:wait}.error{font-size:12px;color:var(--red);margin:10px 0 0;min-height:17px}.admin-wrap{max-width:900px;margin:auto}.admin-wrap h1{font-size:32px;margin:0 0 8px}.admin-wrap>p{color:var(--muted);margin:0 0 25px}.admin-form{max-width:360px;display:flex;flex-direction:column;gap:13px}.admin-form input{border:1px solid var(--line);padding:11px;background:#fbfaf7}.admin-form button,.export{border:0;background:var(--ink);color:white;padding:11px 15px}.admin-tools{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--ink);padding:10px 8px}.admin-table td{border-bottom:1px solid var(--line);padding:12px 8px}.admin-table .mono{font:11px var(--mono)}.admin-swatch{width:24px;height:18px;display:inline-block;vertical-align:middle;border:1px solid #0001}.login-error{color:var(--red);font-size:12px;min-height:18px}.footer{border-top:1px solid var(--line);padding:17px 5vw;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.hidden{display:none!important}
        @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:650px){.topbar{padding:0 18px}.top-right{gap:12px}main{padding:28px 18px 55px}.masthead{align-items:start}.count-block{padding-top:20px}.count-number{font-size:24px}.toolbar{align-items:start;flex-direction:column}.filters{gap:6px}.search{width:100%;max-width:none}.swatches{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.swatch-color{height:64px}.swatch-info{padding:9px}.section-group{display:none}.footer{padding:15px 18px}.admin-table{font-size:10px}.admin-table th,.admin-table td{padding:9px 4px}.admin-wrap h1{font-size:27px}}
        @media(max-width:380px){.swatches{grid-template-columns:1fr}.swatch-color{height:80px}.top-right{gap:8px}.live{font-size:10px}}
    </style>
</head>
<body>
    <header class="topbar"><a class="brand" href="/" style="text-decoration:none"><span class="brand-mark">印</span><span>色票預約所</span></a><div class="top-right"><span class="live">即時同步</span><a class="top-link" href="/admin">管理後台</a></div></header>
    <main id="public-view">
        <div class="masthead"><div><div class="eyebrow">CMYK · PRINT COLOR REGISTER</div><h1>找到你的那一色。</h1><p>選一個喜歡的色票，留下名字，這個顏色就屬於你。</p></div><div class="count-block"><div class="count-number" id="availability">-- / --</div><div class="count-label">色票仍可預約</div></div></div>
        <div class="toolbar"><nav class="filters" id="filters" aria-label="色系篩選"></nav><input id="search" class="search" type="search" placeholder="搜尋色系或 CMYK…" aria-label="搜尋色票"></div>
        <div id="palette"></div>
    </main>
    <main id="admin-view" class="hidden"><div class="admin-wrap"><div class="eyebrow">ADMINISTRATION</div><h1>預約資料</h1><p>已登記色票與預約者資訊。</p><form id="login-form" class="admin-form"><label class="field" style="margin:0">管理密碼<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登入後台</button><div id="login-error" class="login-error"></div></form><div id="admin-data" class="hidden"><div class="admin-tools"><span id="admin-count"></span><button class="export" id="export">匯出 CSV</button></div><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>色票</th><th>色系</th><th>CMYK</th><th>預約者</th><th>聯絡方式</th><th>登記時間</th></tr></thead><tbody id="reservations"></tbody></table></div><div id="admin-empty" class="empty hidden">目前還沒有預約資料。</div></div></div></main>
    <footer class="footer"><span>CMYK COLOR REGISTER</span><span>每張色票限額一位 · 先登記先保留</span></footer>
    <div class="backdrop" id="backdrop" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-color" id="dialog-color"></div><div class="dialog-body"><div class="dialog-top"><div><h2 id="dialog-title">預約色票</h2><div class="dialog-cmyk" id="dialog-cmyk"></div></div><button class="close" id="close-dialog" aria-label="關閉">×</button></div><form id="reserve-form"><label class="field">你的名字<input id="claimant" name="claimant" maxlength="60" required autocomplete="name" placeholder="怎麼稱呼你？"></label><label class="field">聯絡方式 <span style="font-weight:400;color:#77766e">（選填）</span><input id="contact" name="contact" maxlength="120" autocomplete="email" placeholder="Email 或其他聯絡方式"></label><p class="hint">登記後色票即由你保留，名字與聯絡方式只會顯示於管理後台。</p><button class="submit" id="submit-reservation" type="submit">確認預約</button><div class="error" id="form-error" role="status"></div></form></div></section></div>
    <script>
        const groups = [
            {id:'warm',label:'暖色調',items:[
                {id:'yellow',name:'黃色系',colors:[[0,0,20,0],[0,0,40,0],[0,0,60,0],[0,0,80,0],[0,0,100,0]]},
                {id:'orange',name:'橙色系',colors:[[0,60,100,0],[0,40,100,0],[0,20,100,0]]},
                {id:'red',name:'紅色系',colors:[[0,100,40,0],[0,100,60,0],[0,100,80,0],[0,100,100,0]]},
                {id:'pink',name:'粉紅色系',colors:[[0,100,0,0],[0,80,0,0],[0,40,0,0],[0,60,0,0],[0,20,0,0]]},
                {id:'brown',name:'棕色系',colors:[[0,60,60,0],[0,40,40,0],[0,60,80,0]]},
                {id:'brick',name:'暖橘棕、磚紅',colors:[[0,100,100,60],[0,80,100,60],[0,60,100,40]]}
            ]},
            {id:'cool',label:'冷色調',items:[
                {id:'cyan',name:'青色系',colors:[[100,0,0,0],[80,0,0,0],[60,0,0,0],[40,0,0,0],[20,0,0,0]]},
                {id:'blue',name:'藍色系',colors:[[100,20,0,0],[100,40,0,0],[100,60,0,0]]},
                {id:'navy',name:'深藍色系',colors:[[100,40,0,60],[100,60,0,60]]},
                {id:'purple',name:'紫色系',colors:[[100,100,0,0],[80,100,0,0],[60,100,0,0]]},
                {id:'lavender',name:'淡紫色系',colors:[[40,40,0,0],[20,20,0,0]]},
                {id:'teal',name:'青綠色系',colors:[[100,0,60,0],[100,80,80,0],[100,100,100,0]]}
            ]}
        ];
        const colors = groups.flatMap(group => group.items.flatMap(category => category.colors.map(cmyk => ({id:`${category.id}-${cmyk.join('-')}`,group:group.id,category:category.name,categoryId:category.id,cmyk,hex:cmykToHex(cmyk)}))));
        const taken = new Set();
        const $ = selector => document.querySelector(selector);
        const isAdmin = location.pathname.replace(/\/$/,'') === '/admin';
        if(isAdmin){$('#public-view').classList.add('hidden');$('#admin-view').classList.remove('hidden');}
        function cmykToHex([c,m,y,k]){const rgb=[c,m,y].map(value=>Math.round(255*(1-value/100)*(1-k/100)));return '#'+rgb.map(value=>value.toString(16).padStart(2,'0')).join('');}
        function cmykText([c,m,y,k]){return `C${c} M${m} Y${y} K${k}`;}
        function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
        function renderFilters(){const filters=[['all','全部色系'],['warm','暖色調'],['cool','冷色調'],...groups.flatMap(group=>group.items.map(item=>[item.id,item.name]))];$('#filters').innerHTML=filters.map(([id,label],index)=>`<button class="filter${index===0?' active':''}" data-filter="${id}">${label}</button>`).join('');}
        function renderPalette(){const filter=document.querySelector('.filter.active')?.dataset.filter||'all';const query=$('#search').value.trim().toLowerCase();let available=0,total=0;const html=groups.filter(group=>filter==='all'||filter===group.id||group.items.some(item=>item.id===filter)).map(group=>{const categories=group.items.filter(category=>(filter==='all'||filter===group.id||category.id===filter)&&category.colors.some(cmyk=>{const color=colors.find(item=>item.categoryId===category.id&&item.cmyk===cmyk);return !query||`${category.name} ${cmyk.join(' ')}`.toLowerCase().includes(query);}));if(!categories.length)return '';const sections=categories.map(category=>{const items=colors.filter(color=>color.categoryId===category.id&&(!query||`${category.name} ${color.cmyk.join(' ')}`.toLowerCase().includes(query)));if(!items.length)return '';total+=items.length;available+=items.filter(color=>!taken.has(color.id)).length;return `<section class="section"><div class="section-head"><h2>${category.name}</h2><span>${String(items.length).padStart(2,'0')} COLORS</span><span class="section-group">${group.label}</span></div><div class="swatches">${items.map(color=>`<button class="swatch${taken.has(color.id)?' taken':''}" data-color="${color.id}" ${taken.has(color.id)?'disabled':''} aria-label="${category.name} ${cmykText(color.cmyk)}，${taken.has(color.id)?'已被選走':'可預約'}"><div class="swatch-color" style="background:${color.hex}"></div><div class="swatch-info"><div class="swatch-title"><span>${category.name}</span><span class="status">${taken.has(color.id)?'已預約':'可預約 +'}</span></div><div class="cmyk">${cmykText(color.cmyk)}</div><div class="color-code">#${color.hex.slice(1).toUpperCase()}</div></div></button>`).join('')}</div></section>`;}).join('');return sections;}).join('');$('#palette').innerHTML=html||'<div class="empty">找不到符合條件的色票。</div>';$('#availability').textContent=`${available} / ${total}`;}
        async function refreshTaken(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json();taken.clear();data.taken.forEach(id=>taken.add(id));renderPalette();}catch{$('#availability').textContent='離線';}}
        function showDialog(color){$('#dialog-title').textContent=color.category;$('#dialog-cmyk').textContent=`${cmykText(color.cmyk)} · ${color.hex.toUpperCase()}`;$('#dialog-color').style.background=color.hex;$('#form-error').textContent='';$('#claimant').value='';$('#contact').value='';$('#backdrop').dataset.color=color.id;$('#backdrop').classList.add('open');$('#claimant').focus();}
        function closeDialog(){$('#backdrop').classList.remove('open');}
        renderFilters();
        if(!isAdmin){renderPalette();refreshTaken();setInterval(refreshTaken,10000);$('#filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;document.querySelector('.filter.active')?.classList.remove('active');button.classList.add('active');renderPalette();});$('#search').addEventListener('input',renderPalette);$('#palette').addEventListener('click',event=>{const button=event.target.closest('[data-color]');if(button&&!button.disabled)showDialog(colors.find(color=>color.id===button.dataset.color));});$('#close-dialog').addEventListener('click',closeDialog);$('#backdrop').addEventListener('click',event=>{if(event.target===$('#backdrop'))closeDialog();});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDialog();});$('#reserve-form').addEventListener('submit',async event=>{event.preventDefault();const submit=$('#submit-reservation');submit.disabled=true;submit.textContent='登記中…';$('#form-error').textContent='';try{const response=await fetch('/api/reservations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({colorId:$('#backdrop').dataset.color,claimant:$('#claimant').value.trim(),contact:$('#contact').value.trim()})});const result=await response.json();if(response.status===409)throw new Error('這張色票剛被其他人選走了，請挑選其他色票。');if(!response.ok)throw new Error(result.error||'登記失敗，請稍後重試。');taken.add(result.colorId);renderPalette();closeDialog();}catch(error){$('#form-error').textContent=error.message;}finally{submit.disabled=false;submit.textContent='確認預約';}});}
        let adminToken=sessionStorage.getItem('color-chart-admin-token')||'';
        async function loadAdmin(){try{const response=await fetch('/api/admin/reservations',{headers:{Authorization:`Bearer ${adminToken}`}});if(!response.ok){sessionStorage.removeItem('color-chart-admin-token');adminToken='';$('#admin-data').classList.add('hidden');$('#login-form').classList.remove('hidden');if(response.status===401)$('#login-error').textContent='登入已失效，請重新登入。';return;}const records=await response.json();$('#login-form').classList.add('hidden');$('#admin-data').classList.remove('hidden');$('#admin-count').textContent=`共 ${records.length} 筆預約`;$('#admin-empty').classList.toggle('hidden',records.length!==0);$('#reservations').innerHTML=records.map(record=>`<tr><td><span class="admin-swatch" style="background:${escapeHtml(record.hex)}"></span> ${escapeHtml(record.category)}</td><td>${escapeHtml(record.group)}</td><td class="mono">${escapeHtml(cmykText(record.cmyk))}</td><td>${escapeHtml(record.claimant)}</td><td>${escapeHtml(record.contact||'—')}</td><td>${escapeHtml(new Date(record.createdAt).toLocaleString('zh-TW',{hour12:false}))}</td></tr>`).join('');$('#export').onclick=()=>{const rows=[['色系','CMYK','色碼','預約者','聯絡方式','登記時間'],...records.map(record=>[record.category,cmykText(record.cmyk),record.hex,record.claimant,record.contact||'',record.createdAt])];const csv='\uFEFF'+rows.map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='色票預約資料.csv';link.click();URL.revokeObjectURL(link.href);};}catch{$('#login-error').textContent='目前無法連線至伺服器。';}}
        if(isAdmin){if(adminToken)loadAdmin();$('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#login-error').textContent='';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登入失敗');adminToken=data.token;sessionStorage.setItem('color-chart-admin-token',adminToken);$('#password').value='';await loadAdmin();}catch(error){$('#login-error').textContent=error.message;}});}
    </script>
</body>
</html>
