# Copy this file to: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Replace color.example.com with your actual domain.

<VirtualHost *:80>
    ServerName color.example.com
    ServerAlias www.color.example.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    ErrorLog "logs/color-chart-error.log"
    CustomLog "logs/color-chart-access.log" common
</VirtualHost>

# Required Apache modules in C:\xampp\apache\conf\httpd.conf:
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# Include conf/extra/httpd-vhosts.conf