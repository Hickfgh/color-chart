<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶帳號 | 色票預約所</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
        :root{--paper:#f5f2ec;--ink:#24241f;--muted:#77766e;--line:#d8d4ca;--red:#c84b32;--green:#47735a;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}button,input{font:inherit;letter-spacing:0}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#f8f6f1}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700}.mark{width:25px;height:25px;background:var(--red);color:white;display:grid;place-items:center;font:12px var(--mono)}main{max-width:560px;margin:0 auto;padding:38px 22px 70px}.eyebrow{font:11px var(--mono);color:var(--red)}h1{font-size:30px;margin:8px 0}p{color:var(--muted)}.tabs{display:flex;border-bottom:1px solid var(--line);margin:25px 0 20px;gap:18px}.tab{border:0;background:none;padding:10px 0;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-color:var(--red)}.form{display:grid;gap:14px}.field{display:grid;gap:7px;font-size:12px}.field input{padding:11px;border:1px solid var(--line);background:#fbfaf7;outline:none}.field input:focus{border-color:var(--ink)}.primary{border:0;padding:12px;background:var(--red);color:white;font-weight:600;cursor:pointer}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{width:16px;height:16px}.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:12px;cursor:pointer}.status{min-height:19px;color:var(--red);font-size:12px}.hidden{display:none!important}.account-box{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}.success{color:var(--green)}@media(max-width:600px){.topbar{padding:0 18px}main{padding:28px 18px 55px}h1{font-size:27px}}
    </style>
</head>
<body>
    <header class="topbar"><a class="brand" href="/"><span class="mark">印</span><span>色票預約所</span></a><a href="/" style="font-size:12px">回色票頁</a></header>
    <main><div class="eyebrow">CUSTOMER ACCOUNT</div><h1>客戶帳號</h1><p>註冊並驗證 Email 後即可預約；每個帳號限一個有效預約。</p>
        <section id="guest-view"><nav class="tabs"><button class="tab active" data-view="login">登入</button><button class="tab" data-view="register">建立帳號</button><button class="tab" data-view="recover">忘記密碼</button></nav>
            <form id="login-form" class="form"><label class="field">Email<input id="login-email" type="email" required autocomplete="email"></label><label class="field">密碼<input id="login-password" type="password" required autocomplete="current-password"></label><label class="check"><input id="remember-login" type="checkbox">保持登入（共用裝置請勿勾選）</label><button class="primary" type="submit">登入後繼續預約</button><div id="login-status" class="status" role="status"></div></form>
            <form id="register-form" class="form hidden"><label class="field">暱稱<input id="register-nickname" maxlength="60" required autocomplete="nickname"></label><label class="field">Email<input id="register-email" type="email" required autocomplete="email"></label><button id="send-register-code" class="secondary" type="button">寄送 Email 驗證碼</button><label class="field">6 位數驗證碼<input id="register-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code"></label><label class="field">密碼（至少 12 個字元）<input id="register-password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label class="field">再次輸入密碼<input id="register-confirm" type="password" minlength="12" required autocomplete="new-password"></label><label class="check"><input id="register-remember-login" type="checkbox">保持登入（共用裝置請勿勾選）</label><button class="primary" type="submit">驗證並建立帳號</button><div id="register-status" class="status" role="status"></div></form>
            <form id="recover-form" class="form hidden"><label class="field">帳號 Email<input id="recover-email" type="email" required autocomplete="email"></label><button id="send-recovery-code" class="secondary" type="button">寄送重設驗證碼</button><label class="field">6 位數驗證碼<input id="recover-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code"></label><label class="field">新密碼（至少 12 個字元）<input id="recover-password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button class="primary" type="submit">重設密碼</button><div id="recover-status" class="status" role="status"></div></form>
        </section>
        <section id="signed-in-view" class="hidden account-box"><h2 id="account-name"></h2><p id="account-email"></p><div class="row"><a id="continue-booking" class="primary" href="/">返回色票預約</a><button id="logout" class="secondary" type="button">登出</button></div>
            <section class="account-box"><h2>我的預約</h2><div id="my-reservation" class="hidden"><p id="reservation-description"></p><button id="cancel-my-reservation" class="secondary" type="button">取消這筆預約</button></div><p id="no-reservation">目前沒有有效預約。</p><div id="reservation-status" class="status" role="status"></div></section>
            <section class="account-box"><h2>修改暱稱</h2><form id="profile-form" class="form"><label class="field">暱稱<input id="profile-nickname" maxlength="60" required></label><button class="primary" type="submit">儲存暱稱</button><div id="profile-status" class="status" role="status"></div></form></section>
            <section class="account-box"><h2>修改密碼</h2><form id="password-form" class="form"><label class="field">目前密碼<input id="current-password" type="password" required autocomplete="current-password"></label><label class="field">新密碼（至少 12 個字元）<input id="new-password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label class="field">再次輸入新密碼<input id="confirm-password" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary" type="submit">更新密碼</button><div id="password-status" class="status" role="status"></div></form></section>
            <section class="account-box"><h2>變更 Email</h2><form id="email-form" class="form"><label class="field">新 Email<input id="new-email" type="email" required autocomplete="email"></label><button id="send-email-code" class="secondary" type="button">寄送驗證碼到新 Email</button><label class="field">6 位數驗證碼<input id="email-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><button class="primary" type="submit">驗證並更新 Email</button><div id="email-status" class="status" role="status"></div></form></section>
        </section>
    </main>
    <script>
        const $=selector=>document.querySelector(selector);
        const persistentKey='color-chart-customer-token';
        const sessionKey='color-chart-customer-session-token';
        const colorQuery=new URLSearchParams(location.search).get('color');
        $('#continue-booking').href=colorQuery?`/?color=${encodeURIComponent(colorQuery)}`:'/';
        function getToken(){return localStorage.getItem(persistentKey)||sessionStorage.getItem(sessionKey)||'';}
        function setToken(token,remember){localStorage.removeItem(persistentKey);sessionStorage.removeItem(sessionKey);(remember?localStorage:sessionStorage).setItem(remember?persistentKey:sessionKey,token);}
        function showView(name){document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view===name));$('#login-form').classList.toggle('hidden',name!=='login');$('#register-form').classList.toggle('hidden',name!=='register');$('#recover-form').classList.toggle('hidden',name!=='recover');}
        document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>showView(tab.dataset.view)));
        async function customerApi(path,method='GET',body){const token=getToken();const options={method,headers:{Authorization:`Bearer ${token}`}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'操作失敗，請稍後重試。');return data;}
        async function loadAccount(){const token=getToken();if(!token)return;try{const account=await customerApi('/api/customer/me');$('#guest-view').classList.add('hidden');$('#signed-in-view').classList.remove('hidden');$('#account-name').textContent=`你好，${account.nickname}`;$('#account-email').textContent=account.email;$('#profile-nickname').value=account.nickname;$('#new-email').value=account.email;const result=await customerApi('/api/customer/reservation');const reservation=result.reservation;$('#my-reservation').classList.toggle('hidden',!reservation);$('#no-reservation').classList.toggle('hidden',!!reservation);if(reservation)$('#reservation-description').textContent=`${reservation.categoryId} · C${reservation.cmyk[0]} M${reservation.cmyk[1]} Y${reservation.cmyk[2]} K${reservation.cmyk[3]}`;}catch{localStorage.removeItem(persistentKey);sessionStorage.removeItem(sessionKey);}}
        $('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#login-status').textContent='登入中…';try{const remember=$('#remember-login').checked;const response=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#login-email').value.trim(),password:$('#login-password').value,remember})});const data=await response.json();if(!response.ok)throw new Error('Email 或密碼不正確。');setToken(data.token,remember);location.href=colorQuery?`/?color=${encodeURIComponent(colorQuery)}`:'/';}catch(error){$('#login-status').textContent=error.message;}});
        $('#send-register-code').addEventListener('click',async()=>{const status=$('#register-status');status.textContent='正在寄送驗證碼…';try{const response=await fetch('/api/customer/register-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#register-email').value.trim()})});const result=await response.json();if(!response.ok)throw new Error(result.error==='email_unavailable'?'目前無法寄送驗證信，請稍後再試。':result.error==='account_exists'?'此 Email 已有帳號，請改用登入或忘記密碼。':'請輸入有效的 Email。');status.textContent='若 Email 可用，驗證碼已寄出，10 分鐘內有效。';}catch(error){status.textContent=error.message;}});
        $('#register-form').addEventListener('submit',async event=>{event.preventDefault();const status=$('#register-status');status.textContent='';if($('#register-password').value!==$('#register-confirm').value){status.textContent='兩次輸入的密碼不一致。';return;}try{const remember=$('#register-remember-login').checked;const response=await fetch('/api/customer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#register-email').value.trim(),nickname:$('#register-nickname').value.trim(),password:$('#register-password').value,code:$('#register-code').value.trim(),remember})});const data=await response.json();if(!response.ok)throw new Error(data.error==='invalid_or_expired_code'?'驗證碼錯誤或已過期，請重新申請。':'建立帳號失敗，請確認資料。');setToken(data.token,remember);location.href=colorQuery?`/?color=${encodeURIComponent(colorQuery)}`:'/';}catch(error){status.textContent=error.message;}});
        $('#send-recovery-code').addEventListener('click',async()=>{const status=$('#recover-status');status.textContent='正在寄送重設驗證碼…';try{const response=await fetch('/api/customer/recovery-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#recover-email').value.trim()})});const result=await response.json();if(!response.ok)throw new Error(result.error==='email_unavailable'?'目前無法寄送驗證信，請稍後再試。':'請輸入有效的 Email。');status.textContent='若帳號存在，重設驗證碼已寄出，10 分鐘內有效。';}catch(error){status.textContent=error.message;}});
        $('#recover-form').addEventListener('submit',async event=>{event.preventDefault();const status=$('#recover-status');status.textContent='';try{const response=await fetch('/api/customer/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#recover-email').value.trim(),code:$('#recover-code').value.trim(),password:$('#recover-password').value})});const result=await response.json();if(!response.ok)throw new Error(result.error==='invalid_or_expired_code'?'驗證碼錯誤或已過期，請重新申請。':'無法重設密碼，請確認資料。');status.textContent='密碼已重設，請使用新密碼登入。';showView('login');$('#login-email').value=$('#recover-email').value; }catch(error){status.textContent=error.message;}});
        $('#profile-form').addEventListener('submit',async event=>{event.preventDefault();$('#profile-status').textContent='儲存中…';try{const account=await customerApi('/api/customer/profile','POST',{nickname:$('#profile-nickname').value.trim()});$('#account-name').textContent=`你好，${account.nickname}`;$('#profile-status').textContent='暱稱已更新。';}catch(error){$('#profile-status').textContent=error.message;}});
        $('#password-form').addEventListener('submit',async event=>{event.preventDefault();const status=$('#password-status');status.textContent='';if($('#new-password').value!==$('#confirm-password').value){status.textContent='兩次輸入的新密碼不一致。';return;}try{await customerApi('/api/customer/change-password','POST',{currentPassword:$('#current-password').value,newPassword:$('#new-password').value});$('#password-form').reset();status.textContent='密碼已更新。';}catch(error){status.textContent=error.message==='invalid_current_password'?'目前密碼不正確。':error.message==='invalid_new_password'?'新密碼至少 12 個字元。':error.message;}});
        $('#send-email-code').addEventListener('click',async()=>{const status=$('#email-status');status.textContent='正在寄送驗證碼…';try{await customerApi('/api/customer/change-email-code','POST',{email:$('#new-email').value.trim()});status.textContent='驗證碼已寄到新 Email，10 分鐘內有效。';}catch(error){status.textContent=error.message==='email_in_use'?'這個 Email 已有其他帳號使用。':error.message==='email_has_reservation'?'這個 Email 已有有效預約。':error.message==='email_unavailable'?'目前無法寄送驗證碼，請稍後再試。':error.message;}});
        $('#email-form').addEventListener('submit',async event=>{event.preventDefault();const status=$('#email-status');status.textContent='正在更新 Email…';try{const remember=localStorage.getItem(persistentKey)!==null;const result=await customerApi('/api/customer/change-email','POST',{email:$('#new-email').value.trim(),code:$('#email-code').value.trim()});setToken(result.token,remember);$('#account-email').textContent=result.email;$('#email-form').reset();$('#new-email').value=result.email;status.textContent='Email 已更新。';}catch(error){status.textContent=error.message==='invalid_or_expired_code'?'驗證碼錯誤或已過期，請重新申請。':error.message==='email_in_use'?'這個 Email 已有其他帳號使用。':error.message==='email_has_reservation'?'這個 Email 已有有效預約。':error.message;}});
        $('#cancel-my-reservation').addEventListener('click',async()=>{if(!confirm('確定取消這筆預約？取消後可重新選色。'))return;const status=$('#reservation-status');status.textContent='正在取消…';try{await customerApi('/api/customer/reservation/cancel','POST',{});await loadAccount();status.textContent='預約已取消，色票已重新開放。';}catch(error){status.textContent=error.message==='reservation_not_found'?'目前沒有有效預約。':error.message;}});
        $('#logout').addEventListener('click',async()=>{try{await customerApi('/api/customer/logout','POST',{});}catch{}localStorage.removeItem(persistentKey);sessionStorage.removeItem(sessionKey);location.reload();});
        loadAccount();
    </script>
</body>
</html>
